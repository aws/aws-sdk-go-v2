name: Codegen Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read

env:
  # smithy-go is always cloned from the canonical, public aws/smithy-go
  # repository. We never clone or build smithy-go from a fork, so untrusted PR
  # code never executes in this job. Which branch/ref of canonical is used
  # depends on trust: trusted PRs/pushes (see TRUST_BRANCH_MATCH below) may
  # honor a matching-named branch for co-development, while fork PRs always use
  # the pinned SMITHY_GO_CODEGEN_VERSION.
  SMITHY_GO_REPOSITORY: aws/smithy-go

jobs:
  codegen-test:
    name: SDK Codegen Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.24"]
    env:
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    # Decide whether to honor a matching-named branch in aws/smithy-go for
    # co-development. Maintainers push branches directly to aws/aws-sdk-go-v2
    # (not forks), so a non-fork PR head means the author has write access and
    # is trusted. For those, ci-find-smithy-go.sh looks for a same-named branch
    # in canonical aws/smithy-go. External fork PRs skip that search and always
    # use the pinned SMITHY_GO_CODEGEN_VERSION. Either way the repo is canonical
    # aws/smithy-go, so this only gates branch matching, never code provenance.
    - name: Determine smithy-go branch trust
      shell: bash
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          # push to main (or non-PR event): trusted
          echo "TRUST_BRANCH_MATCH=true" >> "$GITHUB_ENV"
        elif [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
          echo "PR head is on $BASE_REPO (non-fork): honoring matching smithy-go branch"
          echo "TRUST_BRANCH_MATCH=true" >> "$GITHUB_ENV"
        else
          echo "PR head is a fork ($HEAD_REPO): using pinned canonical smithy-go only"
          echo "TRUST_BRANCH_MATCH=false" >> "$GITHUB_ENV"
        fi


    - name: Download Coretto 17 JDK
      run: |
        download_url="https://corretto.aws/downloads/latest/amazon-corretto-17-x64-linux-jdk.tar.gz"
        wget -O $RUNNER_TEMP/java_package.tar.gz $download_url

    - name: Set up Coretto 17 JDK
      uses: actions/setup-java@v2
      with:
        distribution: 'jdkfile'
        jdkFile: ${{ runner.temp }}/java_package.tar.gz
        java-version: 17
        architecture: x64

    - uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}

    - name: Find smithy-go
      shell: bash
      env:
        RUNNER_TMPDIR: ${{ runner.temp }}
        TRUST_BRANCH_MATCH: ${{ env.TRUST_BRANCH_MATCH }}
      run: ./ci-find-smithy-go.sh

    - name: Build and publish smithy-go
      working-directory: ${{ runner.temp }}/smithy-go
      run: make smithy-publish-local

    - name: Cleanup smithy-go
      run: rm -rf ${{ runner.temp }}/smithy-go

    - name: SDK Codegen
      run: make smithy-generate

